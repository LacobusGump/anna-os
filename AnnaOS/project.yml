name: AnnaOS
options:
  bundleIdPrefix: com.lacobusgump
  deploymentTarget:
    iOS: "17.0"
    watchOS: "11.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  AnnaPhone:
    type: application
    platform: iOS
    sources:
      - path: AnnaPhone
      - path: Shared
    dependencies:
      - target: AnnaWatch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lacobusgump.anna.phone
        INFOPLIST_FILE: AnnaPhone/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnnaPhone/AnnaPhone.entitlements
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: NO
        EMBEDDED_CONTENT_CONTAINS_SWIFT: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: AnnaPhone/AnnaPhone.entitlements

  AnnaWatch:
    type: application
    platform: watchOS
    sources:
      - path: AnnaWatch
      - path: Shared
    settings:
      base:
        SDKROOT: watchos
        TARGETED_DEVICE_FAMILY: "4"
        WATCHOS_DEPLOYMENT_TARGET: "11.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.lacobusgump.anna.watch
        INFOPLIST_FILE: AnnaWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: AnnaWatch/AnnaWatch.entitlements
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    entitlements:
      path: AnnaWatch/AnnaWatch.entitlements

schemes:
  AnnaPhone:
    build:
      targets:
        AnnaPhone: all
        AnnaWatch: all
    run:
      config: Debug
  AnnaWatch:
    build:
      targets:
        AnnaWatch: all
    run:
      config: Debug